<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090d"><title>API status — Lodearink API</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/observability.css"><script type="module" src="/js/ui.js"></script><script type="module" src="/js/status.js"></script></head><body><div data-header></div><main class="container observability" id="status-root" aria-labelledby="status-title"><div class="obs-heading"><div class="page-top"><div class="eyebrow">API / live status</div><h1 id="status-title">Endpoint status.</h1><p>Current availability and response times.</p></div><div class="obs-heading-actions"><div class="obs-freshness" id="status-freshness" aria-live="polite">Waiting for status</div><button class="button button-ghost obs-refresh" id="status-refresh" type="button">Refresh</button></div></div><div id="status-message" aria-live="polite"></div><section aria-label="Endpoint status"><div id="status-counts" class="obs-status-counts"></div><div id="status-historical"></div><div class="obs-controls"><input type="search" id="status-search" aria-label="Search endpoints" placeholder="Search route or service…"><select id="status-category" aria-label="Filter by category"><option value="">All categories</option></select><select id="status-filter" aria-label="Filter by state"><option value="">All states</option><option value="online">Online</option><option value="degraded">Degraded</option><option value="requires-parameters">Requires parameters</option><option value="unknown">Unknown</option></select><select id="status-coverage" aria-label="Filter by coverage"><option value="">All coverage</option><option value="active">Active checks</option><option value="passive">Passive only</option></select></div><div class="obs-section-head"><div><h2>API endpoints</h2><p id="status-result-count">Loading status…</p></div><p class="obs-filter-note">Updated from liv
